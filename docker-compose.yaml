# QobuzConnectLMS Docker Compose configuration
#
# IMPORTANT: network_mode: host is REQUIRED for mDNS to work.
# This allows the Qobuz app to discover the devices on your local network.
# Without host networking, mDNS multicast packets won't reach the container.
#
# Alternative: use a macvlan network with a dedicated IP address on your LAN.
#
# Place your config.yaml in the data directory mounted at /data.
# See config.yaml.example for LMS speaker configuration.

services:
  qobuzconnectlms:
    # Built locally: the upstream ghcr.io/leolobato/qobuz-proxy image has no LMS backend.
    build: .
    image: qobuzconnectlms:latest
    # Or, once a release is tagged: ghcr.io/makemao/qobuzconnectlms:latest

    container_name: qobuzconnectlms

    # REQUIRED: host networking for mDNS multicast
    network_mode: host

    # /data contains config.yaml and the Qobuz credential cache
    volumes:
      - ./data:/data

    restart: unless-stopped
