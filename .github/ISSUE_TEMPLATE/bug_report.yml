name: Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: |
        What did you do and what went wrong? Please mention:
        - the QobuzConnectLMS version (shown at startup and at the top of the web UI) and how you run it (Docker, pip, OS)
        - your Lyrion Music Server version and Qobuz plugin version
        - the LMS player type (squeezelite, piCorePlayer, Squeezebox hardware, bridge…)
        - the Qobuz app you were using (iOS, Android, desktop)
      placeholder: |
        Playing an album from the Android app to a piCorePlayer (squeezelite) on LMS 9.1.1 with
        Qobuz plugin 3.7.1. Skipping twice quickly stops playback and the app shows the previous song.
        QobuzConnectLMS in Docker on a Raspberry Pi.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs from around the time it happened, ideally at DEBUG level. Set `QOBUZPROXY_LOG_LEVEL=DEBUG`
        (or run with `--log-level DEBUG`), restart, reproduce, then paste the output of
        `docker logs qobuzconnectlms` (or the console output).
        If relevant, add the LMS server log around the same time (LMS web UI → Settings → Information → Logs).
        Remove IP addresses, player MAC addresses and anything else you consider private.
        Never paste auth tokens.
      render: text
    validations:
      required: false
